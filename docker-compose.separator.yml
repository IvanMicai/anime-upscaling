# Voice separator override: adds the optional `separator` service (Demucs on
# PyTorch + CUDA 12.8, several GB) and points the API at it. Merges with
# "voice separation" enabled then align and validate on both tracks without
# voices, which rescues dialogue-heavy episodes. Needs an NVIDIA GPU; combine
# with the NVIDIA override:
#
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml \
#     -f docker-compose.separator.yml up -d --build
#
# The service has no authentication and publishes no port: like the API, it is
# only reachable on the Compose network.
services:
  api:
    environment:
      - SEPARATOR_URL=http://separator:4752

  separator:
    build: apps/separator
    image: anime-upscaling-separator
    container_name: anime-upscaling-separator
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    expose:
      - "4752"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # One card is plenty (~3 GB of VRAM); on a multi-GPU host pick
              # the one encoding uses least.
              device_ids: ["${SEPARATOR_GPU:-0}"]
              capabilities: [gpu, compute, utility]
    mem_limit: ${SEPARATOR_MEM_LIMIT:-12g}
    restart: unless-stopped
